server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com; # Ganti dengan domain/IP VPS

    root /var/www/grossmart/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Sesuaikan versi PHP VPS (8.2 / 8.3)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Lindungi file tersembunyi & database SQLite
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.(sqlite|sqlite3|db)$ {
        deny all;
    }
}
