name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  backend-and-frontend:
    name: Test & Build (PHP & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup Application Key & Database SQLite
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Code Style Check (Pint PSR-12)
        run: ./vendor/bin/pint --test

      - name: Run Backend Tests (PHPUnit)
        run: php artisan test

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend & Typecheck (TypeScript & Vite)
        run: npm run build
